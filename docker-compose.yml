name: danaya
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: danaya
      POSTGRES_USER: danaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U danaya -d danaya]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ./backend/platform
    environment:
      DATABASE_URL: postgresql+psycopg://danaya:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/danaya
    command: [python, -m, app.manage, init-db]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    build: ./backend/platform
    environment:
      DATABASE_URL: postgresql+psycopg://danaya:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/danaya
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    build: ./frontend/staff-portal
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  edge:
    image: caddy:2-alpine
    profiles: [production]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
