name: Verify Danaya
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: danaya
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: danaya_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U danaya -d danaya_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/platform/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m app.manage init-db
        env:
          DATABASE_URL: postgresql+psycopg://danaya:ci-only-disposable-password@localhost:5432/danaya_test
      - run: python -m alembic check
        env:
          DATABASE_URL: postgresql+psycopg://danaya:ci-only-disposable-password@localhost:5432/danaya_test
      - run: python -m pytest tests/test_api.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://danaya:ci-only-disposable-password@localhost:5432/danaya_test
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/staff-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/staff-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/setup-danaya.sh
      - name: Verify gateway and anonymous denial
        run: python3 scripts/smoke.py http://localhost:8080
      - if: always()
        run: docker compose down
